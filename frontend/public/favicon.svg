<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#050a14"/>

  <!-- Head oval -->
  <ellipse cx="16" cy="16" rx="9" ry="11" fill="#0e1a2e" stroke="rgba(80,130,255,0.7)" stroke-width="0.8"/>

  <!-- Brow left -->
  <path d="M10 11.5 Q12 10.5 13.5 11.5" stroke="rgba(0,180,255,0.9)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Brow right -->
  <path d="M18.5 11.5 Q20 10.5 22 11.5" stroke="rgba(0,180,255,0.9)" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Eye left -->
  <ellipse cx="12" cy="15" rx="2.2" ry="1.4" fill="#006FFF"/>
  <ellipse cx="12" cy="15" rx="0.9" ry="0.9" fill="#000a18"/>
  <!-- Eye glow left -->
  <ellipse cx="12" cy="15" rx="2.2" ry="1.4" fill="none" stroke="rgba(0,180,255,0.4)" stroke-width="0.6"/>

  <!-- Eye right -->
  <ellipse cx="20" cy="15" rx="2.2" ry="1.4" fill="#006FFF"/>
  <ellipse cx="20" cy="15" rx="0.9" ry="0.9" fill="#000a18"/>
  <!-- Eye glow right -->
  <ellipse cx="20" cy="15" rx="2.2" ry="1.4" fill="none" stroke="rgba(0,180,255,0.4)" stroke-width="0.6"/>

  <!-- Mouth -->
  <path d="M13 21 Q16 19.5 19 21" stroke="rgba(0,190,255,0.8)" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Crown LEDs -->
  <circle cx="14" cy="6.5" r="0.8" fill="rgba(0,111,255,0.9)"/>
  <circle cx="16" cy="5.8" r="0.8" fill="rgba(0,220,140,0.9)"/>
  <circle cx="18" cy="6.5" r="0.8" fill="rgba(0,111,255,0.9)"/>
</svg>
